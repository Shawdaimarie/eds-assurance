name: correctness-and-security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest
      - run: python -m ruff check src tests scripts examples
      - run: eds-assurance demo --state-dir .local --output reports/ci-demo.json
      - run: eds-assurance verify --state-dir .local --checkpoint reports/ci-demo.json
      - run: python -m pip check
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-evidence-python-${{ matrix.python }}
          path: reports/ci-demo.json
          if-no-files-found: error
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/validate_render.py
      - run: docker build -t eds-assurance:ci .
      - name: Test container health and authenticated workflow
        shell: bash
        run: |
          python scripts/bootstrap_env.py --output .local/ci.env
          set -a
          source .local/ci.env
          set +a
          docker run -d --name eds-assurance-ci --env EDS_API_TOKENS_JSON --env EDS_AUDIT_KEY_HEX -p 127.0.0.1:8000:8000 eds-assurance:ci
          python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen
          for attempt in range(20):
              try:
                  with urlopen('http://127.0.0.1:8000/healthz', timeout=2) as response:
                      assert response.status == 200
                  break
              except (URLError, OSError):
                  time.sleep(1)
          else:
              raise SystemExit('Container health check failed')
          PY
          python examples/api_workflow.py
      - if: always()
        run: docker rm -f eds-assurance-ci || true
