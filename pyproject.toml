[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "eds-assurance"
version = "0.2.0"
description = "Evidence contracts, tenant isolation, and reproducible release checks for AI applications"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.17,<1", "PyYAML>=6,<7", "jsonschema>=4,<5"]

[tool.ruff.lint]
select = ["F"]

[project.scripts]
eds-assurance = "eds_assurance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
